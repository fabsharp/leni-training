<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcul Mental - Léni</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #223;
    --primary: #4f7cff;
    --primary-dark: #3a5fd9;
    --green: #2fb872;
    --red: #e0525f;
    --orange: #ff9f43;
    --muted: #7a8494;
    --shadow: 0 6px 18px rgba(30,50,90,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 32px;
    display: flex;
    flex-direction: column;
  }
  .hidden { display: none !important; }
  h1 { text-align: center; font-size: 2rem; margin: 8px 0 24px; }
  h2 { text-align: center; margin: 4px 0 16px; }

  .menu { display: flex; flex-direction: column; gap: 14px; }
  .menu button {
    font-size: 1.15rem;
    padding: 18px 16px;
    border: none;
    border-radius: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    cursor: pointer;
    font-weight: 600;
    color: var(--text);
  }
  .menu button:active { transform: scale(0.97); }
  .menu button.primary { background: var(--primary); color: white; }
  .menu button.accent { background: var(--orange); color: white; }

  .menu button .code {
    display: inline-block;
    margin-right: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.25);
    font-size: 0.9rem;
    font-weight: 800;
    white-space: nowrap;
  }
  .category { margin-bottom: 22px; }
  .category h3 { margin: 0 0 10px 4px; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .link-btn {
    margin-top: 28px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
    align-self: center;
  }

  .session-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .icon-btn {
    background: var(--card);
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.95rem;
    box-shadow: var(--shadow);
    cursor: pointer;
    color: var(--text);
  }
  #session-info { font-weight: 700; color: var(--muted); text-align: right; font-size: 0.95rem; }
  #session-info .timer, #session-info .progress { font-size: 1.2rem; color: var(--primary-dark); }

  .calc-display {
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    text-align: center;
    font-size: 2.4rem;
    font-weight: 700;
    padding: 28px 10px;
    margin: 18px 0 10px;
    letter-spacing: 1px;
  }
  .answer-display {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    min-height: 2.6rem;
    color: var(--primary-dark);
    letter-spacing: 2px;
  }
  .feedback {
    text-align: center;
    min-height: 1.6rem;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 4px;
  }
  .feedback.correct { color: var(--green); }
  .feedback.wrong { color: var(--red); }

  .calc-display.flash-correct { animation: flashGreen 0.5s ease; }
  .calc-display.flash-wrong { animation: flashRed 0.5s ease; }
  @keyframes flashGreen {
    0% { background: var(--green); color: white; }
    100% { background: var(--card); color: var(--text); }
  }
  @keyframes flashRed {
    0% { background: var(--red); color: white; }
    100% { background: var(--card); color: var(--text); }
  }

  .keypad {
    margin-top: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding-top: 20px;
  }
  .key {
    font-size: 1.6rem;
    font-weight: 700;
    padding: 18px 0;
    border: none;
    border-radius: 14px;
    background: var(--card);
    box-shadow: var(--shadow);
    cursor: pointer;
    color: var(--text);
  }
  .key:active { transform: scale(0.95); }
  .key.ok { background: var(--green); color: white; }
  .key.erase { background: var(--orange); color: white; }

  table#stats-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    font-size: 0.9rem;
  }
  table#stats-table th, table#stats-table td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid #eef1f6;
  }
  table#stats-table th { background: #eef2fb; color: var(--muted); font-size: 0.78rem; }
  #stats-empty { text-align: center; color: var(--muted); margin: 30px 0; }

  .result-card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px 20px;
    text-align: center;
    margin: 20px 0;
  }
  .result-card .score { font-size: 2.6rem; font-weight: 800; color: var(--primary-dark); }
  .result-card .line { margin: 6px 0; color: var(--muted); }

  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions button { flex: 1; }
</style>
</head>
<body>
<div id="app">

  <section id="screen-home" class="screen">
    <h1>🧮 Calcul Mental</h1>
    <div id="home-categories"></div>
    <div class="menu" id="home-menu">
      <button class="accent" id="btn-challenge">⏱️ Défi chronométré</button>
      <button id="btn-stats">📊 Mes points faibles</button>
    </div>
    <button class="link-btn" id="btn-reset">Réinitialiser mes statistiques</button>
  </section>

  <section id="screen-setup" class="screen hidden">
    <div class="session-header">
      <button class="icon-btn" id="btn-setup-back">← Accueil</button>
    </div>
    <h2 id="setup-title">Combien de calculs veux-tu faire ?</h2>
    <div class="menu" id="setup-sizes"></div>
  </section>

  <section id="screen-session" class="screen hidden">
    <div class="session-header">
      <button class="icon-btn" id="btn-back">← Accueil</button>
      <div id="session-info"></div>
    </div>
    <div class="calc-display" id="calc-display">7 × 8</div>
    <div class="answer-display" id="answer-display">&nbsp;</div>
    <div class="feedback" id="feedback">&nbsp;</div>
    <div class="keypad" id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key erase" data-key="back">⌫</button>
      <button class="key" data-key="0">0</button>
      <button class="key ok" data-key="ok">✓</button>
    </div>
  </section>

  <section id="screen-result" class="screen hidden">
    <h2 id="result-title">⏱️ Résultat du défi</h2>
    <div class="result-card">
      <div class="score" id="result-score">0 / 0</div>
      <div class="line" id="result-time"></div>
      <div class="line" id="result-errors"></div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-result-home">Accueil</button>
      <button class="icon-btn" id="btn-result-replay">Rejouer</button>
    </div>
  </section>

  <section id="screen-stats" class="screen hidden">
    <h2>📊 Mes points faibles</h2>
    <div id="stats-empty" class="hidden">Bravo, aucun point faible pour le moment !</div>
    <div style="overflow-x:auto">
      <table id="stats-table">
        <thead>
          <tr><th>Calcul</th><th>Essais</th><th>Erreurs</th><th>Temps récent</th><th>À revoir car</th></tr>
        </thead>
        <tbody id="stats-body"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-review-worst">Revoir ces calculs</button>
      <button class="icon-btn" id="btn-stats-home">Accueil</button>
    </div>
  </section>

</div>

<script src="js/learning.js"></script>
<script src="exercises.config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
